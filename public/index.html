<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Kali Puja 2026 Accounts Portal</title>
  
  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">

  <style>
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: transparent !important;
      position: relative;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 16, 36, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 197, 24, 0.35);
      border-radius: 18px;
      padding: 42px 36px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(245, 197, 24, 0.15);
      position: relative;
      overflow: hidden;
      z-index: 2;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f5c518, #ff6b35, #e63946);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .diya-icon {
      font-size: 48px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 16px rgba(245, 197, 24, 0.75));
      display: inline-block;
      animation: pulseDiya 2.5s infinite ease-in-out;
    }
    @keyframes pulseDiya {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(245, 197, 24, 0.6)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 24px rgba(255, 107, 53, 0.85)); }
    }
    .brand-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13.5px;
      color: #a0a0c0;
      margin-bottom: 0;
    }
    .auth-form .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .auth-form label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #d0d0e0;
      margin-bottom: 8px;
    }
    .auth-form input {
      width: 100%;
      padding: 12px 16px;
      background: #090918;
      border: 1px solid #333355;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14.5px;
      font-family: inherit;
      transition: all 0.25s ease;
    }
    .auth-form input:focus {
      outline: none;
      border-color: #f5c518;
      box-shadow: 0 0 12px rgba(245, 197, 24, 0.35);
      background: #0d0d22;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #f5c518 0%, #ff6b35 100%);
      color: #000000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #ffd700 0%, #ff8c42 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 197, 24, 0.4);
    }
    .auth-footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      font-size: 11.5px;
      color: #8080a0;
    }
    .auth-footer a {
      color: #f5c518;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .alert-error {
      background: rgba(230, 57, 70, 0.15);
      border: 1px solid #e63946;
      color: #ff6b6b;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
  </style>
</head>
<body class="auth-page">

  <!-- Dynamic 20-min Rotating Festive Puja Background Slideshow -->
  <div class="puja-bg-container" id="puja-bg">
    <div class="puja-bg-slide active" style="background-image: url('images/kali-puja-art-showcase.jpg');"></div>
    <div class="puja-bg-slide" style="background-image: url('images/official-hero-banner.png');"></div>
    <div class="puja-bg-slide" style="background-image: url('images/kali-puja-banner-1.jpg');"></div>
    <div class="puja-bg-slide" style="background-image: url('images/kali-puja-banner-3.jpg');"></div>
    <div class="puja-bg-slide" style="background-image: url('images/kali-puja-banner-2.jpg');"></div>
    <div class="puja-bg-slide" style="background-image: url('images/kali-puja-banner-4.jpg');"></div>
  </div>
  <div class="puja-bg-overlay"></div>

  <div class="auth-card">
    <div class="brand-header">
      <img src="images/official-club-logo.png" alt="Neighborhood Club Kali Puja Official Logo" class="auth-logo-img">
      <div class="puja-title-badge">✨ KALI PUJA 2026 OFFICIAL ✨</div>
      <h1 style="margin-top: 4px;">NEIGHBORHOOD CLUB</h1>
      <p class="subtitle">Financial Accounts & Multi-Section Audit Portal</p>
    </div>

    <div id="errorAlert" class="alert-error"></div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="username">
          <i class="fa-solid fa-user" style="color: #f5c518; margin-right: 6px;"></i> Username
        </label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          required 
          placeholder="Enter username" 
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fa-solid fa-lock" style="color: #f5c518; margin-right: 6px;"></i> Password
        </label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          placeholder="Enter password" 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" id="loginBtn" class="btn-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Accounts
      </button>
    </form>

    <div class="auth-footer">
      <p>Neighbourhood Club Audit Committee © 2026</p>
      <p style="margin-top: 4px;">
        <a href="https://docs.google.com/spreadsheets/d/1bTBdyhZaQczAivGacAVuHiwwjnxkikaEeQJaCoeRmTE/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-table-cells"></i> Master Google Spreadsheet
        </a>
      </p>
    </div>
  </div>

  <script>
    // If user is already authenticated, take them directly to the dashboard
    (async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          if (data && data.user) {
            window.location.href = '/dashboard.html';
          }
        }
      } catch (e) {}
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      const loginBtn = document.getElementById('loginBtn');

      errorAlert.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.user) localStorage.setItem('kali_user', JSON.stringify(data.user));
          if (data.token) localStorage.setItem('kali_token', data.token);
          window.location.href = '/dashboard.html';
        } else {
          errorAlert.textContent = data.error || 'Invalid username or password.';
          errorAlert.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Accounts';
        }
      } catch (err) {
        errorAlert.textContent = 'Unable to connect to server. Please try again.';
        errorAlert.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Accounts';
      }
    });
    // 20-min Rotating Festive Puja Background
    const authPujaSlides = document.querySelectorAll('.puja-bg-slide');
    if (authPujaSlides.length > 0) {
      let currentAuthSlide = Math.floor(Math.random() * authPujaSlides.length);
      authPujaSlides.forEach((s, idx) => s.classList.toggle('active', idx === currentAuthSlide));
      setInterval(() => {
        currentAuthSlide = (currentAuthSlide + 1) % authPujaSlides.length;
        authPujaSlides.forEach((s, idx) => s.classList.toggle('active', idx === currentAuthSlide));
      }, 20 * 60 * 1000);
    }
  </script>
</body>
</html>
