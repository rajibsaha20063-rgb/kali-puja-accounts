<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Kali Puja Accounts & Audit 2026</title>
  
  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <div class="diya-icon">🪔</div>
        <h1>NEIGHBOURHOOD CLUB 🔥</h1>
        <p class="subtitle">Kali Puja 2026 | Accounts & Audit System</p>
        <span class="badge-status" id="modeBadge">Checking connection...</span>
      </div>

      <div id="errorAlert" class="alert alert-error" style="display: none; background: rgba(230, 57, 70, 0.2); border: 1px solid var(--red); color: #ff6b6b; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;"></div>
      <div id="successAlert" class="alert alert-success" style="display: none; background: rgba(46, 204, 113, 0.2); border: 1px solid var(--green); color: #2ecc71; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="e.g. admin" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="padding: 12px; font-size: 15px; font-weight: 700;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="quick-credentials">
        <p class="quick-title">⚡ Quick Demo Login (Click to test):</p>
        <div class="quick-btn-grid">
          <button type="button" class="btn btn-chip" onclick="fillCreds('admin', 'admin123')">
            👑 <strong>Admin</strong> &nbsp;— Full control & user management
          </button>
          <button type="button" class="btn btn-chip" onclick="fillCreds('collector1', 'collector123')">
            📝 <strong>Collector</strong> &nbsp;— Update collection amounts
          </button>
          <button type="button" class="btn btn-chip" onclick="fillCreds('viewer1', 'viewer123')">
            👀 <strong>Viewer</strong> &nbsp;— Read-only financial audit
          </button>
        </div>
      </div>

      <div class="auth-footer">
        <p>Google Spreadsheet: <code>1bTBdyhZaQczAivGac...</code></p>
        <p>Neighbourhood Club Audit Committee © 2026</p>
      </div>
    </div>
  </div>

  <script>
    // Check if already authenticated
    (async function checkExistingAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          if (data && data.user) {
            window.location.href = '/dashboard.html';
          }
        }
      } catch (e) {}
    })();

    // Fetch system status
    fetch('/api/system/status')
      .then(res => res.json())
      .then(data => {
        const badge = document.getElementById('modeBadge');
        if (!badge) return;
        if (data.isDemoMode) {
          badge.textContent = '⚡ DEMO MODE (Local Data)';
          badge.className = 'badge-status badge-demo';
        } else {
          badge.textContent = '🟢 LIVE SYNC (Google Sheets Connected)';
          badge.className = 'badge-status badge-live';
        }
      })
      .catch(() => {
        const badge = document.getElementById('modeBadge');
        if (badge) {
          badge.textContent = '⚡ DEMO MODE (Local Data)';
          badge.className = 'badge-status badge-demo';
        }
      });

    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('loginBtn').focus();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      const loginBtn = document.getElementById('loginBtn');

      errorAlert.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.user) localStorage.setItem('kali_user', JSON.stringify(data.user));
          if (data.token) localStorage.setItem('kali_token', data.token);
          window.location.href = '/dashboard.html';
        } else {
          errorAlert.textContent = data.error || 'Invalid username or password.';
          errorAlert.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
        }
      } catch (err) {
        errorAlert.textContent = 'Unable to connect to server. Please try again.';
        errorAlert.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
