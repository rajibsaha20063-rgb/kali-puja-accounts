<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন | কালী পূজা হিসাব ও নিরীক্ষা (Kali Puja Accounts)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <div class="diya-icon">🪔</div>
        <h1>কালী পূজা হিসাব ও নিরীক্ষা</h1>
        <p class="subtitle">Neighbourhood Club Kali Puja Accounts & Audit</p>
        <span class="badge-status" id="modeBadge">যাচাই করা হচ্ছে...</span>
      </div>

      <div id="errorAlert" class="alert alert-error" style="display: none;"></div>
      <div id="successAlert" class="alert alert-success" style="display: none;"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="username">ব্যবহারকারীর নাম (Username)</label>
          <input type="text" id="username" name="username" required placeholder="admin" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">পাসওয়ার্ড (Password)</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
          লগইন করুন (Sign In)
        </button>
      </form>

      <div class="quick-credentials">
        <p class="quick-title">⚡ ডেমো অ্যাকাউন্ট দিয়ে দ্রুত প্রবেশ করুন:</p>
        <div class="quick-btn-grid">
          <button type="button" class="btn btn-chip" onclick="fillCreds('admin', 'admin123')">
            👑 Admin (সম্পূর্ণ অধিকার)
          </button>
          <button type="button" class="btn btn-chip" onclick="fillCreds('collector1', 'collector123')">
            📝 Collector (চাঁদা তোলার দায়িত্ব)
          </button>
          <button type="button" class="btn btn-chip" onclick="fillCreds('viewer1', 'viewer123')">
            👀 Viewer (নিরীক্ষা ও হিসাব দেখা)
          </button>
        </div>
      </div>

      <div class="auth-footer">
        <p>Google Spreadsheet ID: <code>1bTBdyh...</code></p>
        <p>Neighbourhood Club Audit Committee © 2026</p>
      </div>
    </div>
  </div>

  <script>
    // Fetch system status
    fetch('/api/system/status')
      .then(res => res.json())
      .then(data => {
        const badge = document.getElementById('modeBadge');
        if (data.isDemoMode) {
          badge.textContent = '⚡ DEMO MODE (লোকাল ডাটা)';
          badge.className = 'badge-status badge-demo';
        } else {
          badge.textContent = '🟢 LIVE SYNC (Google Sheets সংযুক্ত)';
          badge.className = 'badge-status badge-live';
        }
      })
      .catch(() => {});

    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('loginBtn').focus();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      const loginBtn = document.getElementById('loginBtn');

      errorAlert.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'যাচাই করা হচ্ছে...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.user) localStorage.setItem('kali_user', JSON.stringify(data.user));
          if (data.token) localStorage.setItem('kali_token', data.token);
          window.location.href = '/dashboard.html';
        } else {
          errorAlert.textContent = data.error || 'ভুল ইউজারনেম বা পাসওয়ার্ড!';
          errorAlert.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'লগইন করুন (Sign In)';
        }
      } catch (err) {
        errorAlert.textContent = 'সার্ভারে সংযোগ করা যায়নি। দয়া করে আবার চেষ্টা করুন।';
        errorAlert.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'লগইন করুন (Sign In)';
      }
    });
  </script>
</body>
</html>
